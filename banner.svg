<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a1f1f"/>
      <stop offset="18%" stop-color="#c8931a"/>
      <stop offset="45%" stop-color="#0d0d0d"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="78%" stop-color="#3f4a2f"/>
      <stop offset="100%" stop-color="#5c6b45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="110" fill="url(#shine)"/>

  <!-- straw hat silhouette -->
  <g transform="translate(120,110)" stroke="#ffe8b0" stroke-width="3" fill="none" opacity="0.9">
    <ellipse cx="0" cy="20" rx="55" ry="14"/>
    <path d="M -30 20 Q 0 -28 30 20 Z" fill="#ffe8b0" fill-opacity="0.12"/>
    <path d="M -32 12 L 32 12" stroke="#c0392b" stroke-width="5"/>
  </g>

  <!-- katana silhouette -->
  <g transform="translate(500,110) rotate(-25)" stroke="#eaeaea" stroke-width="3" fill="none" opacity="0.9">
    <line x1="-70" y1="0" x2="60" y2="0"/>
    <line x1="60" y1="0" x2="78" y2="0" stroke-width="5"/>
    <circle cx="-70" cy="0" r="9"/>
    <line x1="-95" y1="-14" x2="-95" y2="14" stroke-width="4"/>
  </g>

  <!-- wings silhouette (generic, not the AOT insignia) -->
  <g transform="translate(860,110)" stroke="#dfe6d0" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 0 0 C -25 -30 -55 -25 -70 5 C -45 0 -25 10 0 0 Z"/>
    <path d="M 0 0 C 25 -30 55 -25 70 5 C 45 0 25 10 0 0 Z"/>
  </g>

  <text x="500" y="185" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" fill="#f5f0e6" opacity="0.85">
    forged in retrieval bugs • sharpened by debugging • flying toward the goal
  </text>
</svg>
